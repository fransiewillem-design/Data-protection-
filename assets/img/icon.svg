  <path d="M22.5 15 L32 22.5 L41.5 15" fill="none" stroke="#4c3fe0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M27 34 V40 M32 33 V42 M37 34 V40" stroke="#fff" stroke-opacity=".7" stroke-width="2.4" stroke-linecap="round"/>
  <!-- front half of the hoop -->
