name: Deploy to GitHub Pages

on:
  push:
    # This repo has no `main` yet: the first branch pushed became the default.
    # Both are listed so the deploy fires now and keeps working after a rename.
    branches:
      - main
      - claude/data-breach-spam-blocker-7kvnrh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site through the API when it does not exist yet,
          # so enabling Pages needs no trip through repository settings. Needs
          # the `pages: write` permission granted above, and a repo eligible for
          # Pages (public, or private on a paid plan).
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
