name: Deploy to GitHub Pages

on:
  # The live site is hoopup.tech on Cloudflare Pages, which builds on every
  # push by itself. GitHub Pages has been unpublished, so this workflow no
  # longer runs automatically; it is kept as a manual fallback host
  # (Actions -> Deploy to GitHub Pages -> Run workflow), after re-enabling
  # Pages under Settings -> Pages.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Asks the API to create the Pages site if it does not exist. Kept
          # because it makes this workflow portable, but do not rely on it: in
          # this repository it is refused with "Resource not accessible by
          # integration", because the default GITHUB_TOKEN cannot create a Pages
          # site however its permissions are declared. The site has to be
          # created once by hand, under Settings -> Pages -> Source: GitHub
          # Actions. After that this step finds the existing site and no
          # creation is attempted.
          enablement: true
      # Copies the site into dist/ and stamps the commit into asset URLs.
      # The same script is the Cloudflare Pages build command.
      - name: Build
        run: sh scripts/build.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
