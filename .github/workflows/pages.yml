name: Deploy to GitHub Pages

on:
  push:
    # This repo has no `main` yet: the first branch pushed became the default.
    # Both are listed so the deploy fires now and keeps working after a rename.
    branches:
      - main
      - claude/data-breach-spam-blocker-7kvnrh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Asks the API to create the Pages site if it does not exist. Kept
          # because it makes this workflow portable, but do not rely on it: in
          # this repository it is refused with "Resource not accessible by
          # integration", because the default GITHUB_TOKEN cannot create a Pages
          # site however its permissions are declared. The site has to be
          # created once by hand, under Settings -> Pages -> Source: GitHub
          # Actions. After that this step finds the existing site and no
          # creation is attempted.
          enablement: true
      # Without this, a browser happily mixes a fresh index.html with month-old
      # cached modules and the deploy looks like it did nothing. Stamping the
      # commit into every asset URL makes each deploy a distinct set of files.
      - name: Stamp the build into asset URLs
        run: |
          SHA="${GITHUB_SHA::7}"
          sed -i "s|src=\"src/app.js\"|src=\"src/app.js?v=$SHA\"|" index.html
          sed -i "s|href=\"assets/css/app.css\"|href=\"assets/css/app.css?v=$SHA\"|" index.html
          sed -i "s|__BUILD__|$SHA|g" index.html
          sed -i -E "s|(from '\./[A-Za-z0-9_-]+\.js)'|\1?v=$SHA'|g" src/*.js
          sed -i "s|fetch('data/brokers.json')|fetch('data/brokers.json?v=$SHA')|" src/app.js
          echo "--- stamped as $SHA ---"
          grep -o 'src/app.js?v=[a-f0-9]*' index.html
          grep -ho "from '\./[a-z]*\.js?v=[a-f0-9]*'" src/*.js | sort -u

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
